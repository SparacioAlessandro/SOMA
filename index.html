<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOMA Framework | Modular Mindfulness Library</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans selection:bg-teal-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- Standardized Placeholder Component ---
        const IconPlaceholder = ({ name = "mic", size = 20, className = "" }) => (
            <div className={`w-12 h-12 rounded-lg bg-teal-50 border border-teal-100 flex items-center justify-center ${className}`}>
                <Icon name={name} size={size} className="text-teal-400" />
            </div>
        );

        // --- Modular Data: Themes (A/B Variations) ---
        const THEMES = [
            { id: 'SOMA-M-T01A', title: 'Being (Variation A)', variant: 'T01A', icon: 'mic', description: 'Foundational stabilization and presence.' },
            { id: 'SOMA-M-T01B', title: 'Being (Variation B)', variant: 'T01B', icon: 'heart', description: 'Stabilization via sensory groundedness.' },
            { id: 'SOMA-M-T02A', title: 'Curiosity (Variation A)', variant: 'T02A', icon: 'zap', description: 'Cultivating beginner\'s mind in routine.' },
            { id: 'SOMA-M-T02B', title: 'Curiosity (Variation B)', variant: 'T02B', icon: 'target', description: 'Investigative awareness of breath.' },
            { id: 'SOMA-M-T03A', title: 'Patience (Variation A)', variant: 'T03A', icon: 'wind', description: 'Allowing the unfolding of movement.' },
            { id: 'SOMA-M-T03B', title: 'Patience (Variation B)', variant: 'T03B', icon: 'map-pin', description: 'Step-by-step presence in transition.' },
            { id: 'SOMA-M-T04A', title: 'Acceptance (Variation A)', variant: 'T04A', icon: 'hand', description: 'Radical allowing of bodily sensation.' },
            { id: 'SOMA-M-T04B', title: 'Acceptance (Variation B)', variant: 'T04B', icon: 'ear', description: 'Listening with non-judgmental presence.' },
            { id: 'SOMA-M-T05A', title: 'Letting Go (Variation A)', variant: 'T05A', icon: 'cloud-lightning', description: 'Releasing attachment to outcomes.' },
            { id: 'SOMA-M-T05B', title: 'Letting Go (Variation B)', variant: 'T05B', icon: 'umbrella', description: 'Attentional flexibility and release.' },
            { id: 'SOMA-M-T06A', title: 'Gentleness (Variation A)', variant: 'T06A', icon: 'feather', description: 'Compassionate self-touch and warmth.' },
            { id: 'SOMA-M-T06B', title: 'Gentleness (Variation B)', variant: 'T06B', icon: 'bath', description: 'Gentle care in manual action.' }
        ];

        // --- Modular Data: Practices (P01-P16) ---
        const PRACTICES = [
            { id: 'SOMA-M-P01', title: 'Opening the Senses' },
            { id: 'SOMA-M-P02', title: 'Being with the Senses' },
            { id: 'SOMA-M-P03', title: 'Being with the Present' },
            { id: 'SOMA-M-P04', title: 'Mindful Drinking' },
            { id: 'SOMA-M-P05', title: 'Brushing Teeth' },
            { id: 'SOMA-M-P06', title: 'Awareness of Breath' },
            { id: 'SOMA-M-P07', title: 'Mindful Movements' },
            { id: 'SOMA-M-P08', title: 'Mindful Walking' },
            { id: 'SOMA-M-P09', title: 'Awareness of Body' },
            { id: 'SOMA-M-P10', title: 'Tuning in to the Body' },
            { id: 'SOMA-M-P11', title: 'Listening Practice' },
            { id: 'SOMA-M-P12', title: 'Tuning in to Sounds' },
            { id: 'SOMA-M-P13', title: 'Mindful Eating' },
            { id: 'SOMA-M-P14', title: 'Body Scan' },
            { id: 'SOMA-M-P15', title: 'Self-Compassion' },
            { id: 'SOMA-M-P16', title: 'Mindful Handwashing' }
        ];

        // --- Standard UI Section Component ---
        const Section = ({ title, children, className = "" }) => (
            <div className={`mb-12 ${className}`}>
                <h2 className="text-2xl font-bold text-slate-800 mb-6 border-b pb-2 border-slate-200">{title}</h2>
                <div className="text-slate-700 leading-relaxed space-y-4">{children}</div>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isAuthenticated, setIsAuthenticated] = useState(false);

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl p-10 max-w-md w-full shadow-2xl">
                            <h1 className="text-2xl font-bold text-center mb-6">SOMA Framework Preview</h1>
                            <input type="password" placeholder="soma2026" className="w-full px-4 py-3 rounded-xl border border-slate-300 mb-4 focus:ring-2 focus:ring-teal-500 outline-none" autoFocus />
                            <button onClick={() => setIsAuthenticated(true)} className="w-full bg-slate-900 text-white font-bold py-3 rounded-xl hover:bg-slate-800 transition-all">Unlock Library</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20 selection:bg-teal-100">
                    <nav className="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
                        <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 font-bold text-xl cursor-pointer" onClick={() => setActiveTab('home')}>
                                <div className="bg-teal-600 text-white w-8 h-8 rounded flex items-center justify-center font-bold italic">S</div>
                                SOMA <span className="text-teal-600 font-normal italic">Framework</span>
                            </div>
                            <div className="flex gap-8 text-sm font-semibold">
                                {['home', 'library', 'methodology'].map(t => (
                                    <button key={t} onClick={() => setActiveTab(t)} className={activeTab === t ? 'text-teal-600 underline decoration-2 underline-offset-8' : 'text-slate-500'}>{t.toUpperCase()}</button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-6 pt-12 animate-in">
                        {/* --- TAB 1: HOME (RESTORED CONTENT) --- */}
                        {activeTab === 'home' && (
                            <div>
                                <div className="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white rounded-[2.5rem] p-12 mb-12 shadow-2xl relative overflow-hidden">
                                    <div className="relative z-10">
                                        <h1 className="text-5xl font-bold mb-6 max-w-3xl leading-tight">Bridging Equity and Rigor in Digital Mindfulness</h1>
                                        <p className="text-slate-400 text-xl max-w-2xl mb-8 leading-relaxed">Standardized Open-source Mindfulness Audio (SOMA): A modular architecture for mechanistic precision and universal accessibility.</p>
                                        <button onClick={() => setActiveTab('library')} className="bg-teal-500 px-8 py-4 rounded-xl font-bold hover:bg-teal-400 transition-all flex items-center gap-2 text-white">Explore Library <Icon name="arrow-right" size={20}/></button>
                                    </div>
                                    <div className="absolute top-0 right-0 w-1/3 h-full bg-gradient-to-l from-teal-500/10 to-transparent"></div>
                                </div>

                                <div className="grid md:grid-cols-3 gap-6 mb-16">
                                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                                        <div className="w-12 h-12 bg-red-50 text-red-600 rounded-xl flex items-center justify-center mb-6"><Icon name="target"/></div>
                                        <h3 className="text-xl font-bold mb-2">Mechanistic Rigor</h3>
                                        <p className="text-slate-500 text-sm leading-relaxed">Matched Active Controls eliminate expectancy confounds to isolate genuine mechanisms of change.</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                                        <div className="w-12 h-12 bg-teal-50 text-teal-600 rounded-xl flex items-center justify-center mb-6"><Icon name="users"/></div>
                                        <h3 className="text-xl font-bold mb-2">Health Equity</h3>
                                        <p className="text-slate-500 text-sm leading-relaxed">Validated at Grade 5–6 reading level for inclusive access across diverse SES backgrounds.</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                                        <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mb-6"><Icon name="layers"/></div>
                                        <h3 className="text-xl font-bold mb-2">Modular Matrix</h3>
                                        <p className="text-slate-500 text-sm leading-relaxed">Formal decoupling of thematic content from sensory delivery for precise dismantling studies.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- TAB 2: LIBRARY (UPDATED WITH MODULAR STRUCTURE) --- */}
                        {activeTab === 'library' && (
                            <div className="space-y-16">
                                <section>
                                    <h2 className="text-3xl font-bold mb-2 flex items-center gap-3"><Icon name="book-open" className="text-teal-600"/> 1. Thematic Introductions</h2>
                                    <p className="text-slate-500 mb-8">2-3 minute conceptual framings with Universal Bridge transitions.</p>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        {THEMES.map(theme => (
                                            <div key={theme.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:border-teal-400 transition-all group">
                                                <div className="flex gap-4 mb-4">
                                                    <IconPlaceholder name={theme.icon} size={24} />
                                                    <div>
                                                        <div className="text-[10px] font-mono text-slate-400">{theme.id}</div>
                                                        <h3 className="font-bold text-sm">{theme.title}</h3>
                                                    </div>
                                                </div>
                                                <p className="text-xs text-slate-500 mb-6 min-h-[32px] leading-relaxed">{theme.description}</p>
                                                <div className="flex gap-2 pt-4 border-t border-slate-100">
                                                    <a href={`audio/${theme.id}.mp3`} className="flex-1 bg-teal-50 text-teal-700 py-2 rounded-lg text-xs font-bold text-center">Play</a>
                                                    <a href={`audio/${theme.id}.mp3`} download className="flex-1 bg-slate-50 text-slate-500 py-2 rounded-lg text-xs font-bold text-center">Download</a>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <section>
                                    <h2 className="text-3xl font-bold mb-2 flex items-center gap-3"><Icon name="target" className="text-teal-600"/> 2. Sensory Practices</h2>
                                    <p className="text-slate-500 mb-8 h-10">10-minute mechanistically orthogonal modules (e.g., P01-P16).</p>
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                        {PRACTICES.map(prac => (
                                            <div key={prac.id} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm group">
                                                <div className="text-[10px] font-mono text-slate-400 mb-2">{prac.id}</div>
                                                <h3 className="text-sm font-bold mb-4 h-10">{prac.title}</h3>
                                                <div className="flex gap-2">
                                                    <a href={`audio/${prac.id}.mp3`} className="flex-1 bg-teal-50 text-teal-600 p-2 rounded-lg flex items-center justify-center hover:bg-teal-100"><Icon name="play" size={14}/></a>
                                                    <a href={`audio/${prac.id}.mp3`} download className="flex-1 bg-slate-50 text-slate-400 p-2 rounded-lg flex items-center justify-center hover:bg-slate-100"><Icon name="download" size={14}/></a>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </div>
                        )}

                        {/* --- TAB 3: METHODOLOGY (RESTORED & VERIFIED CLEAN) --- */}
                        {activeTab === 'methodology' && (
                            <div className="max-w-4xl mx-auto space-y-12">
                                <h1 className="text-3xl font-bold mb-8">Methodology & Principles</h1>
                                <Section title="Principle 1: Structural Equivalence">
                                    <p>We introduce a rigorous structural matching standard. Unlike passive waitlist controls, SOMA Active Controls are matched to interventions on four critical dimensions:</p>
                                    <ul className="list-disc pl-6 space-y-2 bg-slate-50 p-6 rounded-lg">
                                        <li><strong>Duration:</strong> Identical 10-12 minute commitment.</li>
                                        <li><strong>Prosody:</strong> Recorded by the same instructors with matching vocal pace (~100 wpm).</li>
                                        <li><strong>Structure:</strong> Identical Intro-Bridge-Practice architecture.</li>
                                        <li><strong>Burden:</strong> Matched daily practice and homework requirements.</li>
                                    </ul>
                                </Section>
                                <Section title="Principle 2: Mechanistic Orthogonality">
                                    <p>The Active Control is designed as Analytical Training. While Mindfulness tracks direct bottom-up sensing, Control tracks direct top-down categorizing and verifying.</p>
                                    <div className="bg-teal-50 p-6 rounded-lg border border-teal-100 text-sm">
                                        <strong>Example Verb Substitution:</strong><br/>
                                        <em>Mindfulness:</em> Notice the sound without labeling it.<br/>
                                        <em>Control:</em> Identify the sound and classify its source.
                                    </div>
                                </Section>
                                <Section title="Principle 3: Equity-by-Design">
                                    <p>Accessibility is a foundational constraint, not a post-hoc analysis.</p>
                                    <ul className="space-y-4">
                                        <li className="border-l-4 border-teal-500 pl-4 py-1">
                                            <strong>Linguistic Accessibility:</strong> Scripts refined to Grade 5-6 reading level to ensure inclusion of diverse SES backgrounds.
                                        </li>
                                        <li className="border-l-4 border-teal-500 pl-4 py-1">
                                            <strong>Resource Neutrality:</strong> Instructions explicitly welcome environmental noise, removing the "quiet space" barrier.
                                        </li>
                                    </ul>
                                </Section>
                            </div>
                        )}
                    </main>

                    <footer className="bg-slate-900 text-slate-500 py-20 border-t border-slate-800 mt-20">
                        <div className="max-w-7xl mx-auto px-4 grid md:grid-cols-3 gap-12">
                            <div>
                                <h4 className="text-white font-bold mb-4 uppercase tracking-widest text-xs">About SOMA</h4>
                                <p className="text-sm leading-relaxed max-w-sm">An international initiative dedicated to bridging the equity gap in mindfulness science through open-source, standardized materials.</p>
                            </div>
                            <div>
                                <h4 className="text-white font-bold mb-4 uppercase tracking-widest text-xs">Repository</h4>
                                <ul className="text-sm space-y-3">
                                    <li><a href="#" className="hover:text-teal-500 flex items-center gap-2"><Icon name="external-link" size={12}/> OSF Repository</a></li>
                                    <li><a href="#" className="hover:text-teal-500 flex items-center gap-2"><Icon name="github" size={12}/> GitHub Code</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-white font-bold mb-4 uppercase tracking-widest text-xs">License</h4>
                                <p className="text-sm">Licensed under CC-BY 4.0. Open-source for non-commercial research use.</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
