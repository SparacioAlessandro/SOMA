<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOMA Framework | Standardized Open-source Mindfulness Audio</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans selection:bg-teal-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const THEMES = [
            { id: 'SOMA-M-T01A', title: 'Being (Variation A)', variant: 'T01A', img: 'https://images.unsplash.com/photo-1499209974870-0dc4b0d50320?w=100&h=100&fit=crop', description: 'Foundational stabilization and presence.' },
            { id: 'SOMA-M-T01B', title: 'Being (Variation B)', variant: 'T01B', img: 'https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=100&h=100&fit=crop', description: 'Stabilization via sensory groundedness.' },
            { id: 'SOMA-M-T02A', title: 'Curiosity (Variation A)', variant: 'T02A', img: 'https://images.unsplash.com/photo-1455587734955-081b22074882?w=100&h=100&fit=crop', description: 'Cultivating beginner\'s mind in routine.' },
            { id: 'SOMA-M-T02B', title: 'Curiosity (Variation B)', variant: 'T02B', img: 'https://images.unsplash.com/photo-1518241353330-0f7941c2d9b5?w=100&h=100&fit=crop', description: 'Investigative awareness of breath.' },
            { id: 'SOMA-M-T03A', title: 'Patience (Variation A)', variant: 'T03A', img: 'https://images.unsplash.com/photo-1516054144188-f93933ba49b5?w=100&h=100&fit=crop', description: 'Allowing the unfolding of movement.' },
            { id: 'SOMA-M-T03B', title: 'Patience (Variation B)', variant: 'T03B', img: 'https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=100&h=100&fit=crop', description: 'Step-by-step presence in transition.' },
            { id: 'SOMA-M-T04A', title: 'Acceptance (Variation A)', variant: 'T04A', img: 'https://images.unsplash.com/photo-1470770903676-69b98201ea1c?w=100&h=100&fit=crop', description: 'Radical allowing of bodily sensation.' },
            { id: 'SOMA-M-T04B', title: 'Acceptance (Variation B)', variant: 'T04B', img: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=100&h=100&fit=crop', description: 'Listening with non-judgmental presence.' },
            { id: 'SOMA-M-T05A', title: 'Letting Go (Variation A)', variant: 'T05A', img: 'https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?w=100&h=100&fit=crop', description: 'Releasing attachment to outcomes.' },
            { id: 'SOMA-M-T05B', title: 'Letting Go (Variation B)', variant: 'T05B', img: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=100&h=100&fit=crop', description: 'Attentional flexibility and release.' },
            { id: 'SOMA-M-T06A', title: 'Gentleness (Variation A)', variant: 'T06A', img: 'https://images.unsplash.com/photo-1516589174184-c6858b16ecb0?w=100&h=100&fit=crop', description: 'Compassionate self-touch and warmth.' },
            { id: 'SOMA-M-T06B', title: 'Gentleness (Variation B)', variant: 'T06B', img: 'https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?w=100&h=100&fit=crop', description: 'Gentle care in manual action.' }
        ];

        const PRACTICES = [
            { id: 'SOMA-M-P01', title: 'Opening the Senses' },
            { id: 'SOMA-M-P02', title: 'Being with the Senses' },
            { id: 'SOMA-M-P03', title: 'Being with the Present' },
            { id: 'SOMA-M-P04', title: 'Mindful Drinking' },
            { id: 'SOMA-M-P05', title: 'Brushing Teeth' },
            { id: 'SOMA-M-P06', title: 'Awareness of Breath' },
            { id: 'SOMA-M-P07', title: 'Mindful Movements' },
            { id: 'SOMA-M-P08', title: 'Mindful Walking' },
            { id: 'SOMA-M-P09', title: 'Awareness of Body' },
            { id: 'SOMA-M-P10', title: 'Tuning in to the Body' },
            { id: 'SOMA-M-P11', title: 'Listening Practice' },
            { id: 'SOMA-M-P12', title: 'Tuning in to Sounds' },
            { id: 'SOMA-M-P13', title: 'Mindful Eating' },
            { id: 'SOMA-M-P14', title: 'Body Scan' },
            { id: 'SOMA-M-P15', title: 'Self-Compassion' },
            { id: 'SOMA-M-P16', title: 'Mindful Handwashing' }
        ];

        const Section = ({ title, children }) => (
            <div className="mb-12">
                <h2 className="text-2xl font-bold text-slate-800 mb-6 border-b pb-2 border-slate-200">{title}</h2>
                <div className="text-slate-700 leading-relaxed space-y-4">{children}</div>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isAuthenticated, setIsAuthenticated] = useState(false);

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="w-16 h-16 bg-teal-100 rounded-full flex items-center justify-center mx-auto mb-4 text-teal-600"><Icon name="lock" size={32} /></div>
                                <h1 className="text-2xl font-bold text-slate-800">SOMA Framework</h1>
                                <p className="text-slate-500 mt-2">Private Research Preview. Enter access code.</p>
                            </div>
                            <form onSubmit={(e) => { e.preventDefault(); setIsAuthenticated(true); }} className="space-y-4">
                                <input type="password" placeholder="soma2026" className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 outline-none transition-all" autoFocus />
                                <button type="submit" className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition-all shadow-lg">Unlock Access</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen">
                    <nav className="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setActiveTab('home')}>
                                <div className="w-8 h-8 bg-teal-600 rounded flex items-center justify-center text-white font-bold italic">S</div>
                                <span className="font-bold text-xl tracking-tight">SOMA <span className="text-teal-600 font-normal">Framework</span></span>
                            </div>
                            <div className="hidden md:flex gap-8">
                                {['home', 'library', 'methodology'].map(tab => (
                                    <button key={tab} onClick={() => setActiveTab(tab)} className={`capitalize text-sm font-semibold transition-colors ${activeTab === tab ? 'text-teal-600 border-b-2 border-teal-600' : 'text-slate-500 hover:text-slate-800'}`}>{tab}</button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-4 py-12 animate-in">
                        {activeTab === 'home' && (
                            <div>
                                <div className="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white rounded-[2rem] p-12 mb-12 shadow-2xl relative overflow-hidden">
                                    <div className="relative z-10">
                                        <h1 className="text-5xl font-bold mb-6 max-w-3xl leading-tight text-white">Bridging Equity and Rigor in Digital Mindfulness</h1>
                                        <p className="text-slate-400 text-xl max-w-2xl mb-8 leading-relaxed">Standardized Open-source Mindfulness Audio (SOMA): A modular architecture for mechanistic precision and universal accessibility.</p>
                                        <div className="flex gap-4">
                                            <button onClick={() => setActiveTab('library')} className="bg-teal-500 hover:bg-teal-400 px-8 py-4 rounded-xl font-bold transition-all flex items-center gap-2 shadow-lg shadow-teal-500/20 text-white">Explore Library <Icon name="arrow-right" size={20}/></button>
                                        </div>
                                    </div>
                                    <div className="absolute top-0 right-0 w-1/3 h-full bg-gradient-to-l from-teal-500/5 to-transparent"></div>
                                </div>

                                <div className="grid md:grid-cols-3 gap-6 mb-16">
                                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                                        <div className="w-12 h-12 bg-red-50 text-red-600 rounded-xl flex items-center justify-center mb-6"><Icon name="target"/></div>
                                        <h3 className="text-lg font-bold mb-2">Mechanistic Rigor</h3>
                                        <p className="text-slate-500 text-sm leading-relaxed">Matched Active Controls eliminate expectancy confounds to isolate genuine mechanisms of change.</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                                        <div className="w-12 h-12 bg-teal-50 text-teal-600 rounded-xl flex items-center justify-center mb-6"><Icon name="users"/></div>
                                        <h3 className="text-lg font-bold mb-2">Health Equity</h3>
                                        <p className="text-slate-500 text-sm leading-relaxed">Validated at Grade 5–6 reading level for inclusive access across diverse SES backgrounds.</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                                        <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mb-6"><Icon name="layers"/></div>
                                        <h3 className="text-lg font-bold mb-2">Modular Matrix</h3>
                                        <p className="text-slate-500 text-sm leading-relaxed">Formal decoupling of thematic content from sensory delivery for precise dismantling studies.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'library' && (
                            <div className="space-y-16">
                                <section>
                                    <h2 className="text-3xl font-bold mb-2 flex items-center gap-3"><Icon name="book-open" className="text-teal-600"/> 1. Thematic Introductions</h2>
                                    <p className="text-slate-500 mb-8">2-3 minute conceptual framings with Universal Bridge transitions.</p>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        {THEMES.map(theme => (
                                            <div key={theme.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:border-teal-400 transition-all group">
                                                <div className="flex gap-4 mb-4">
                                                    <img src={theme.img} className="w-12 h-12 rounded-lg object-cover" alt={theme.title} />
                                                    <div>
                                                        <div className="text-[10px] font-mono text-slate-400">{theme.id}</div>
                                                        <h3 className="font-bold text-sm">{theme.title}</h3>
                                                    </div>
                                                </div>
                                                <p className="text-xs text-slate-500 mb-6 min-h-[32px]">{theme.description}</p>
                                                <div className="flex gap-2">
                                                    <a href={`audio/${theme.id}.mp3`} className="flex-1 bg-teal-50 text-teal-700 py-2 rounded-lg text-xs font-bold text-center">Play</a>
                                                    <a href={`audio/${theme.id}.mp3`} download className="flex-1 bg-slate-50 text-slate-500 py-2 rounded-lg text-xs font-bold text-center">Download</a>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <section>
                                    <h2 className="text-3xl font-bold mb-2 flex items-center gap-3"><Icon name="target" className="text-teal-600"/> 2. Sensory Practices</h2>
                                    <p className="text-slate-500 mb-8">10-minute mechanistically orthogonal modules.</p>
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                        {PRACTICES.map(prac => (
                                            <div key={prac.id} className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm group">
                                                <div className="text-[10px] font-mono text-slate-400 mb-2">{prac.id}</div>
                                                <h3 className="text-sm font-bold mb-4 h-10">{prac.title}</h3>
                                                <div className="flex gap-2">
                                                    <a href={`audio/${prac.id}.mp3`} className="flex-1 bg-teal-50 text-teal-600 p-2 rounded-lg flex items-center justify-center hover:bg-teal-100"><Icon name="play" size={14}/></a>
                                                    <a href={`audio/${prac.id}.mp3`} download className="flex-1 bg-slate-50 text-slate-400 p-2 rounded-lg flex items-center justify-center hover:bg-slate-100"><Icon name="download" size={14}/></a>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </div>
                        )}

                        {activeTab === 'methodology' && (
                            <div className="max-w-4xl mx-auto">
                                <h1 className="text-3xl font-bold mb-8">Methodology & Principles</h1>
                                <Section title="Principle 1: Structural Equivalence">
                                    <p>We introduce a rigorous structural matching standard. Unlike passive waitlist controls, SOMA Active Controls are matched to interventions on four critical dimensions: [cite: 38]</p>
                                    <ul className="list-disc pl-6 space-y-2 bg-slate-50 p-6 rounded-lg">
                                        <li><strong>Duration:</strong> Identical 10-12 minute commitment. [cite: 73, 80]</li>
                                        <li><strong>Prosody:</strong> Recorded by the same instructors with matching vocal pace (~100 wpm). [cite: 80, 110]</li>
                                        <li><strong>Structure:</strong> Identical "Intro-Bridge-Practice" architecture. [cite: 108]</li>
                                        <li><strong>Burden:</strong> Matched daily practice and homework requirements. [cite: 38, 82]</li>
                                    </ul>
                                </Section>
                                <Section title="Principle 2: Mechanistic Orthogonality">
                                    <p>The Active Control is designed as "Analytical Training." While Mindfulness tracks direct bottom-up sensing, Control tracks direct top-down categorizing and verifying. [cite: 82, 83]</p>
                                    <div className="bg-teal-50 p-6 rounded-lg border border-teal-100 text-sm">
                                        <strong>Example Verb Substitution:</strong> [cite: 85, 86]<br/>
                                        <em>Mindfulness:</em> "Notice the sound without labeling it."<br/>
                                        <em>Control:</em> "Identify the sound and classify its source."
                                    </div>
                                </Section>
                                <Section title="Principle 3: Equity-by-Design">
                                    <p>Accessibility is a foundational constraint, not a post-hoc analysis. [cite: 37]</p>
                                    <ul className="space-y-4">
                                        <li className="border-l-4 border-teal-500 pl-4 py-1">
                                            <strong>Linguistic Accessibility:</strong> Scripts refined to Grade 5-6 reading level to ensure inclusion of diverse SES backgrounds. [cite: 40, 79]
                                        </li>
                                        <li className="border-l-4 border-teal-500 pl-4 py-1">
                                            <strong>Resource Neutrality:</strong> Instructions explicitly welcome environmental noise, removing the "quiet space" barrier. [cite: 40, 77]
                                        </li>
                                    </ul>
                                </Section>
                            </div>
                        )}
                    </main>

                    <footer className="bg-slate-900 text-slate-500 py-20 border-t border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 grid md:grid-cols-3 gap-12">
                            <div>
                                <h4 className="text-white font-bold mb-4 uppercase tracking-widest text-xs">About SOMA</h4>
                                <p className="text-sm leading-relaxed">An international initiative dedicated to bridging the equity gap in mindfulness science through open-source, standardized materials. [cite: 18]</p>
                            </div>
                            <div>
                                <h4 className="text-white font-bold mb-4 uppercase tracking-widest text-xs">Repository</h4>
                                <ul className="text-sm space-y-3">
                                    <li><a href="#" className="hover:text-teal-500 flex items-center gap-2 font-medium"><Icon name="external-link" size={12}/> OSF Repository [cite: 9, 236]</a></li>
                                    <li><a href="#" className="hover:text-teal-500 flex items-center gap-2 font-medium"><Icon name="github" size={12}/> GitHub Code [cite: 238]</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-white font-bold mb-4 uppercase tracking-widest text-xs">License</h4>
                                <p className="text-sm">Licensed under CC-BY 4.0. Open-source for non-commercial research use. [cite: 278]</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
