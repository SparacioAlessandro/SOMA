<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOMA Framework | Standardized Open-source Mindfulness Audio</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans selection:bg-teal-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- Confirmatory Data from Manuscript ---
        const LIBRARY_DATA = [
            { 
                id: 'SOMA-M-01', 
                title: 'Mindfulness: Awareness of Breath', 
                theme: 'Curiosity', 
                mode: 'Mindfulness', 
                mechanism: 'Bottom-up Sensing',
                duration: '12 min', 
                description: 'Directs sensing and allowing. Validated at Grade 5–6 reading level.' 
            },
            { 
                id: 'SOMA-C-01', 
                title: 'Active Control: Analytical Training', 
                theme: 'Categorization', 
                mode: 'Active Control', 
                mechanism: 'Top-down Processing',
                duration: '12 min', 
                description: 'Structurally matched "Trojan Horse" control. Directs categorizing and verifying.' 
            },
            { 
                id: 'SOMA-M-02', 
                title: 'Mindfulness: Body Scan', 
                theme: 'Acceptance', 
                mode: 'Mindfulness', 
                mechanism: 'Bottom-up Sensing',
                duration: '12 min', 
                description: 'Focuses on allowing physical sensations without judgment or intervention.' 
            }
        ];

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [isAuthenticated, setIsAuthenticated] = useState(false);

            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <div className="w-16 h-16 bg-teal-100 rounded-full flex items-center justify-center mx-auto mb-4 text-teal-600">
                                    <Icon name="lock" size={32} />
                                </div>
                                <h1 className="text-2xl font-bold text-slate-800">SOMA Framework</h1>
                                <p className="text-slate-500 mt-2">Private Research Preview. Enter access code.</p>
                            </div>
                            <form onSubmit={(e) => { e.preventDefault(); setIsAuthenticated(true); }} className="space-y-4">
                                <input type="password" placeholder="Enter code (e.g., soma2026)" className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 outline-none transition-all" autoFocus />
                                <button type="submit" className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition-all shadow-lg">Unlock Access</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen">
                    <nav className="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-200">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setActiveTab('home')}>
                                <div className="w-8 h-8 bg-teal-600 rounded flex items-center justify-center text-white font-bold italic">S</div>
                                <span className="font-bold text-xl tracking-tight">SOMA <span className="text-teal-600 font-normal">Framework</span></span>
                            </div>
                            <div className="hidden md:flex gap-8">
                                {['home', 'library', 'methodology'].map(tab => (
                                    <button key={tab} onClick={() => setActiveTab(tab)} className={`capitalize text-sm font-semibold transition-colors ${activeTab === tab ? 'text-teal-600 border-b-2 border-teal-600' : 'text-slate-500 hover:text-slate-800'}`}>{tab}</button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-4 py-12 animate-in">
                        {activeTab === 'home' && (
                            <div>
                                <div className="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white rounded-[2rem] p-12 mb-12 shadow-2xl relative overflow-hidden">
                                    <div className="relative z-10">
                                        <h1 className="text-5xl font-bold mb-6 max-w-3xl leading-tight">Bridging Equity and Rigor in Digital Mindfulness</h1>
                                        <p className="text-slate-400 text-xl max-w-2xl mb-8 leading-relaxed">Standardized Open-source Mindfulness Audio (SOMA): A modular architecture for mechanistic precision and universal accessibility.</p>
                                        <div className="flex gap-4">
                                            <button onClick={() => setActiveTab('library')} className="bg-teal-500 hover:bg-teal-400 px-8 py-4 rounded-xl font-bold transition-all flex items-center gap-2 shadow-lg shadow-teal-500/20">Explore Library <Icon name="arrow-right" size={20}/></button>
                                        </div>
                                    </div>
                                    <div className="absolute top-0 right-0 w-1/3 h-full bg-gradient-to-l from-teal-500/5 to-transparent"></div>
                                </div>

                                <div className="grid md:grid-cols-3 gap-6 mb-16">
                                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                                        <div className="w-12 h-12 bg-red-50 text-red-600 rounded-xl flex items-center justify-center mb-6"><Icon name="target"/></div>
                                        <h3 className="text-lg font-bold mb-2">Mechanistic Rigor</h3>
                                        <p className="text-slate-500 text-sm leading-relaxed">Matched Active Controls eliminate expectancy confounds to isolate genuine mechanisms of change.</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                                        <div className="w-12 h-12 bg-teal-50 text-teal-600 rounded-xl flex items-center justify-center mb-6"><Icon name="users"/></div>
                                        <h3 className="text-lg font-bold mb-2">Health Equity</h3>
                                        <p className="text-slate-500 text-sm leading-relaxed">Validated at Grade 5–6 reading level for inclusive access across diverse SES backgrounds.</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
                                        <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center mb-6"><Icon name="layers"/></div>
                                        <h3 className="text-lg font-bold mb-2">Modular Matrix</h3>
                                        <p className="text-slate-500 text-sm leading-relaxed">Formal decoupling of thematic content from sensory delivery for precise dismantling studies.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'library' && (
                            <div>
                                <h2 className="text-3xl font-bold mb-2">The SOMA Library</h2>
                                <p className="text-slate-500 mb-8">Modular assets designed for research reproducibility and health equity.</p>
                                <div className="grid md:grid-cols-3 gap-6">
                                    {LIBRARY_DATA.map(item => (
                                        <div key={item.id} className="bg-white border border-slate-200 p-6 rounded-2xl hover:border-teal-500 transition-all shadow-sm group">
                                            <div className="flex justify-between items-start mb-4">
                                                <span className={`text-[10px] font-bold px-2 py-1 rounded-full uppercase tracking-widest ${item.mode === 'Mindfulness' ? 'bg-teal-100 text-teal-700' : 'bg-orange-100 text-orange-700'}`}>{item.mode}</span>
                                                <span className="text-xs font-mono text-slate-400">{item.id}</span>
                                            </div>
                                            <h3 className="text-lg font-bold mb-1">{item.title}</h3>
                                            <div className="text-[10px] text-teal-600 font-bold uppercase mb-4 tracking-wider">{item.mechanism}</div>
                                            <p className="text-slate-500 text-sm mb-6 leading-relaxed min-h-[60px]">{item.description}</p>
                                            <div className="flex gap-2">
                                                <button className="flex-1 bg-slate-50 text-slate-700 py-3 rounded-xl text-xs font-bold hover:bg-slate-100 transition-colors flex items-center justify-center gap-2"><Icon name="music" size={14}/> Audio</button>
                                                <button className="flex-1 bg-slate-50 text-slate-700 py-3 rounded-xl text-xs font-bold hover:bg-slate-100 transition-colors flex items-center justify-center gap-2"><Icon name="file-text" size={14}/> Script</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="bg-slate-900 text-slate-500 py-20 border-t border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 grid md:grid-cols-3 gap-12">
                            <div>
                                <h4 className="text-white font-bold mb-4 uppercase tracking-widest text-xs">About SOMA</h4>
                                <p className="text-sm leading-relaxed">An international initiative dedicated to bridging the equity gap in mindfulness science through open-source, standardized materials.</p>
                            </div>
                            <div>
                                <h4 className="text-white font-bold mb-4 uppercase tracking-widest text-xs">Repository</h4>
                                <ul className="text-sm space-y-3">
                                    <li><a href="#" className="hover:text-teal-500 flex items-center gap-2"><Icon name="external-link" size={12}/> OSF Repository</a></li>
                                    <li><a href="#" className="hover:text-teal-500 flex items-center gap-2"><Icon name="github" size={12}/> GitHub Code</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-white font-bold mb-4 uppercase tracking-widest text-xs">License</h4>
                                <p className="text-sm">Licensed under CC-BY 4.0. Open-source for non-commercial research use.</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
